services:
  # ============================================================
  # FASTAPI WEB SERVICE
  # ============================================================
  - type: web
    name: mepf-server
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: MEPF_SERVER_URL
        value: https://mepf-server.onrender.com

      - key: MEPF_API_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"


  # ============================================================
  # PAYLOAD DISPATCHER BACKGROUND WORKER
  # ============================================================
  - type: worker
    name: mepf-payload-dispatcher
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python -m dispatcher.payload_dispatcher

    envVars:
      - key: MEPF_SERVER_URL
        value: https://mepf-server.onrender.com

      - key: MEPF_API_KEY
        sync: false

      - key: MEPF_PAYLOAD_INBOX
        value: /opt/render/project/src/payloads/inbox

      - key: MEPF_PAYLOAD_PROCESSING
        value: /opt/render/project/src/payloads/processing

      - key: MEPF_PAYLOAD_SUCCEEDED
        value: /opt/render/project/src/payloads/succeeded

      - key: MEPF_PAYLOAD_FAILED
        value: /opt/render/project/src/payloads/failed

      - key: MEPF_PAYLOAD_AMBIGUOUS
        value: /opt/render/project/src/payloads/ambiguous

      - key: MEPF_PAYLOAD_INVALID
        value: /opt/render/project/src/payloads/invalid

      - key: PYTHONUNBUFFERED
        value: "1"
