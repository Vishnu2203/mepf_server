services:
  - type: web
    name: multiple-system-payload-send
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mepf-postgres
          property: connectionString
      - key: MEPF_API_KEY
        sync: false

databases:
  - name: mepf-postgres
    plan: free
