services:
  - type: web
    name: mepf-server
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: bash start.sh

    envVars:
      - key: MEPF_SERVER_URL
        value: https://mepf-server.onrender.com

      - key: MEPF_API_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"
